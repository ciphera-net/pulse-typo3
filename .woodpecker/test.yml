# Runs on pull_request AND on push to main.
#
# A workflow that only runs on pull requests checks the proposal and never the
# branch that ships, so this one runs on both.
#
# This is a lighter gate on purpose. The real check builds TYPO3 13 and 14 and
# reads the tag out of a rendered page (scripts/verify.sh), which needs the full
# CMS. This repository has no PHPUnit tests.
#
# What this covers: the syntax of every PHP file, that composer.json passes
# `composer validate --strict`, and that the YAML under Configuration/ parses.
#
# What this does NOT cover: anything that happens inside TYPO3 (the event
# listener wiring, the exact bytes of the rendered tag), whether the service
# definitions resolve against the TYPO3 container, and PHP syntax newer than
# 8.3. Run scripts/verify.sh before a release.
when:
  - event: pull_request
  - event: push
    branch: main

labels:
  runner: k8s

steps:
  - name: lint
    image: registry.ops.ciphera.net/mirror/docker.io/library/php:8.3-cli-alpine-74c3e6f3f78d@sha256:74c3e6f3f78d8bdd090b1d565ef0040c4cd8c7b3757996638cba05dcb87fc94a
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 64Mi, cpu: 50m }
          limits: { memory: 256Mi }
    commands:
      - php --version
      # The file count is asserted too: a find that matches nothing would lint
      # nothing and pass.
      - |
        find . -path ./.git -prune -o -type f -name '*.php' -print | sort > /tmp/php-files.txt
        COUNT=$(wc -l < /tmp/php-files.txt)
        echo "linting $COUNT PHP file(s)"
        [ "$COUNT" -ge 4 ] || { echo "REFUSING: expected at least 4 PHP files, found $COUNT."; exit 1; }
        FAILED=0
        while read -r f; do
          php -l "$f" > /tmp/lint.out 2>&1 || { cat /tmp/lint.out; FAILED=1; }
        done < /tmp/php-files.txt
        [ "$FAILED" -eq 0 ] || exit 1

  - name: config
    image: registry.ops.ciphera.net/mirror/docker.io/library/composer:2.11.1@sha256:07cb23c4c9d528524a8b9a67c403d6ad7fef2268651eb1448e3874d40f28b789
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    commands:
      - composer --version
      - composer validate --strict
      # symfony/yaml is installed outside the workspace, so the extension's own
      # files are the only thing checked.
      - |
        mkdir /tmp/yaml-check
        composer require --working-dir=/tmp/yaml-check --no-interaction --no-progress symfony/yaml
        php -r 'require "/tmp/yaml-check/vendor/autoload.php"; if (count($argv) < 2) { fwrite(STDERR, "REFUSING: no YAML files found\n"); exit(1); } $bad = 0; foreach (array_slice($argv, 1) as $f) { try { Symfony\Component\Yaml\Yaml::parseFile($f); echo "yaml ok: $f\n"; } catch (Throwable $e) { fwrite(STDERR, "yaml error in $f: " . $e->getMessage() . "\n"); $bad = 1; } } exit($bad);' $(find . -path ./.git -prune -o -type f \( -name '*.yaml' -o -name '*.yml' \) -print)
